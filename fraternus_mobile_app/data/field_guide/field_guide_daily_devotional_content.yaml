- year_number: 1
  week_number: 3
  virtue: "Chastity"
  vice: "Lust"
  extreme: "Prudishness"
  quotes:
    - quote: "No chastity is secure if You do not guard it."
      author: "Thomas à Kempis"
    - quote: "Love is circumspect, humble, and upright. It is neither soft nor light, nor intent upon vain things. It is sober and chaste, firm and quiet, guarded in all the senses."
      author: "Thomas à Kempis"
  reflection: "Chastity frees us from the vice of lust, which is selfish impurity, the habit of using people and things selfishly and for pleasure alone. The chaste man is not only free from many vices, but he has greater purity of intention and consistency in love. Because he flees temptations to lust, when the time comes, he is free to love fully. This virtue requires daily vigilance."
  choleric_application: "Strong-willed enough to set boundaries but tempted to use intensity as justification for indulgence."
  choleric_vices: "Rationalizing excess, dominating relationships, objectifying through conquest."
  sanguine_application: "Drawn to pleasure and novelty — chastity demands discipline the sanguine finds exhausting."
  sanguine_vices: "Flirtation, lack of boundaries, dangerous screen habits."
  melancholic_application: "Idealizes purity but can spiral into scrupulosity when they fail — grace is essential."
  melancholic_vices: "Fantasy and escapism, obsessive guilt, emotional dependency."
  phlegmatic_application: "May avoid temptation through passivity rather than virtue — true chastity is an active choice."
  phlegmatic_vices: "Passive consumption, avoiding accountability, drifting into habitual sin."
  daily_devotionals:
    - day_number: 1

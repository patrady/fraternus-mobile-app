- year_number: 1
  week_number: 7
  virtue: "Diligence"
  vice: "Sloth"
  extreme: "Workaholism"
  quotes:
    - quote: "Be watchful and diligent in God's service and often think of why you left the world and came here. Was it not that you might live for God and become a spiritual man?"
      author: "Thomas à Kempis"
    - quote: "Without care and diligence, you will never acquire virtue."
      author: "Thomas à Kempis"
  reflection: "Diligence frees us from the vice of sloth, which is a deceptive snare. It does not always look like lying on a couch. It comes also in busyness, distraction, and it even causes us to be sad about things we know are good, like the spiritual life. Sloth is about avoiding our dignity and calling as sons of God. Diligence is not workaholism; it is the disciplined habit of doing what matters and having zeal for what God wants."
  choleric_application: "Naturally diligent but risks workaholism — true diligence is ordered, not obsessive."
  choleric_vices: "Overwork, neglecting relationships for results, perfectionism."

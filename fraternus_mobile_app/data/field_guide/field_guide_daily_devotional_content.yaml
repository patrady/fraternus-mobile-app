- year_number: 1
  week_number: 4
  virtue: "Patience"
  vice: "Anger"
  extreme: "Indifference"
  quotes:
    - quote: "Dispose thyself to patience rather than consolation, and to bear the Cross rather than to rejoice."
      author: "Thomas à Kempis"
    - quote: "Turn thine eyes back upon thyself, and see thou judge not the doings of others."
      author: "Thomas à Kempis"
  reflection: "Patience undoes the vice of wrath, which is disordered anger. The patient man is not easily provoked, is not given to outbursts or wrath, and deals calmly with life's difficulties. He is not indifferent to difficulties but responds with order. He is especially careful with his reactions and is not surprised by his own defects or those of others. Patience is not weakness, but a form of enduring strength."
  choleric_application: "Patience is the choleric's greatest battle — they want results now and view waiting as weakness."
  choleric_vices: "Explosive anger, impatience with incompetence, bulldozing people."
  sanguine_application: "Patient in social settings but deeply impatient with tedious or unglamorous tasks."
  sanguine_vices: "Restlessness, abandoning projects midway, emotional volatility."
  melancholic_application: "Patient with ideas but impatient with people who do not meet their standards."
  melancholic_vices: "Resentment, cold anger, passive-aggressive withdrawal."
  phlegmatic_application: "Naturally patient but may confuse patience with avoidance — true patience endures difficulty but does not ignore it."
  phlegmatic_vices: "Stubbornness disguised as patience, procrastination, conflict avoidance."
  daily_devotionals:
    - day_number: 1
      identity_reading: "By God's grace, I am a man who is patient, avoiding both anger and indifference."
      wisdom_quote: "He does well who regards rather the common good than his own will."

      author: "Thomas à Kempis"
  reflection: "Kindness frees us from the sin of envy, which is when the goods of others causes our sadness. Envy whispers that another man's success diminishes yours. Envy causes us to compare ourselves with others, desire what they have, and be blind to our own blessings. Kindness is the antidote (timidity), but a genuine orientation toward the good of others. A kind man is free, because he is not competing."

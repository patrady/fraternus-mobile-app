      closing_prayer_author: "St. Augustine"
    - day_number: 7
      identity_reading: "By God's grace, I am a man who is humble, avoiding both pride and self loathing."
      wisdom_quote: "The saints that are highest in the sight of God are the least in their own eyes; and the more glorious they are the more humble they are in themselves."
      wisdom_author: "Thomas à Kempis"
      sword_option_1: "The battle against pride and self-reliance; I will acknowledge how much I need others."

- year_number: 1
  week_number: 1
  virtue: "Humility"
  vice: "Pride"
  extreme: "Self-Loathing"
  quotes:
    - quote: "It is the humble man whom God protects and liberates; it is the humble whom He loves and consoles. To the humble He turns and upon them bestows great grace, that after their humiliation He may raise them up to glory."
      author: "Thomas à Kempis"
    - quote: "Many people try to escape temptations, only to fall more deeply. We cannot conquer simply by fleeing, but by patience and true humility, we become stronger than all our enemies."
      author: "Thomas à Kempis"
  reflection: "Pride has a deep root. Every vice grows from it. This week, through humility you will take note of how often you want to be right, to be seen, to be above others. Pride was the first sin of man, and we fight it until our last breath, learning to trust God. Humility is not weakness. It is the quiet strength of a man who knows his place before God and does not need applause, recognition, or control, because he lives in the truth."
  choleric_application: "Struggles most with humility. Their natural drive to lead and dominate makes submission feel like defeat."
  choleric_vices: "Arrogance, contempt for weakness, need to be right."
  sanguine_application: "Craves attention and approval, making hidden service deeply uncomfortable."
  sanguine_vices: "Vanity, name-dropping, exaggerating accomplishments"
  melancholic_application: "Can mistake self-criticism for humility. True humility requires accepting imperfection without despair."
  melancholic_vices: "Intellectual pride, perfectionism disguised as high standards"
  phlegmatic_application: "Appears humble but may simply be avoiding conflict. Genuine humility requires active surrender, not passive withdrawal."
  phlegmatic_vices: "False modesty, using humility as an excuse for inaction"
  daily_devotionals:
    - day_number: 1
      identity_reading: "By God's grace, I am a man who is humble, avoiding both pride and self loathing."
      wisdom_quote: "He who knows himself well, is mean in his own eyes, and is not delighted with being praised by men."
      wisdom_author: "Thomas à Kempis"
      sword_option_1: "The pull toward control, self-reliance, or proving myself; I will let God lead instead."
      sword_option_2: "The pull toward comfort, approval, or staying invisible; I will serve without recognition instead."
      spade_prompt: "Where did I notice pride or humility at work in me today?"
      closing_prayer: "God, always the same, let me know myself, let me know You. Let me know You, O Lord, who know me; let me know You, as I am known. Amen."
      closing_prayer_author: "St. Augustine"
    - day_number: 2
      identity_reading: "By God's grace, I am a man who is humble, avoiding both pride and self loathing."
      wisdom_quote: "We are all frail: but see thou think no one more frail than myself."
      wisdom_author: "Thomas à Kempis"
      sword_option_1: "The temptation to manage everything myself; I will trust God and act with humility instead."
      sword_option_2: "The temptation to avoid sacrifice or difficulty; I will choose courage and duty instead."
      spade_prompt: "Where did I notice pride or humility at work in me today?"
      closing_prayer: "God, always the same, let me know myself, let me know You. Let me know You, O Lord, who know me; let me know You, as I am known. Amen."
      closing_prayer_author: "St. Augustine"
    - day_number: 3
      identity_reading: "By God's grace, I am a man who is humble, avoiding both pride and self loathing."
      wisdom_quote: "The more humble a man is in himself, and more subject to God, the more wise will he be in all things, and the more at peace."
      wisdom_author: "Thomas à Kempis"
      sword_option_1: "The desire to succeed, impress, or stay in control; I will live as a son instead."
      sword_option_2: "The desire to remain comfortable, unnoticed, or affirmed; I will step forward in service instead."
      spade_prompt: "Where did I notice pride or humility at work in me today?"
      closing_prayer: "God, always the same, let me know myself, let me know You. Let me know You, O Lord, who know me; let me know You, as I am known. Amen."
      closing_prayer_author: "St. Augustine"
    - day_number: 4
      identity_reading: "By God's grace, I am a man who is humble, avoiding both pride and self loathing."
      wisdom_quote: "We have reason, therefore, to humble ourselves and never to think much of ourselves since we are so frail and inconstant."
      wisdom_author: "Thomas à Kempis"
      sword_option_1: "The urge to rely on my own strength; I will depend on grace instead."
      sword_option_2: "The urge to coast, delay or stay passive; I will embrace discipline instead."
      spade_prompt: "Where did I notice pride or humility at work in me today?"
      closing_prayer: "God, always the same, let me know myself, let me know You. Let me know You, O Lord, who know me; let me know You, as I am known. Amen."
      closing_prayer_author: "St. Augustine"
    - day_number: 5
      identity_reading: "By God's grace, I am a man who is humble, avoiding both pride and self loathing."
      wisdom_quote: "Thou has not anything in which thou canst glory, but many things for which thou oughtst to humble thyself, for thou art much weaker than thou art able to comprehend."
      wisdom_author: "Thomas à Kempis"
      sword_option_1: "The pull toward pride, pressure, or perfectionism; I will receive today with humility instead."
      sword_option_2: "The pull toward ease, distraction, or pleasing others; I will choose to please God and not man or self."
      spade_prompt: "Where did I notice pride or humility at work in me today?"
      closing_prayer: "God, always the same, let me know myself, let me know You. Let me know You, O Lord, who know me; let me know You, as I am known. Amen."
      closing_prayer_author: "St. Augustine"
    - day_number: 6
      identity_reading: "By God's grace, I am a man who is humble, avoiding both pride and self loathing."
      wisdom_quote: "Therefore thou must not ascribe anything of good to thyself, nor attribute virtue to any man, but give all to God, without whom man is nothing."
      wisdom_author: "Thomas à Kempis"
      sword_option_1: "The temptation to control outcomes or prove my strength; I will give credit to God for the work He does in me."
      sword_option_2: "The temptation to hide, withdraw, or avoid discomfort; I will love through sacrifice instead."
      spade_prompt: "Where did I notice pride or humility at work in me today?"
      closing_prayer: "God, always the same, let me know myself, let me know You. Let me know You, O Lord, who know me; let me know You, as I am known. Amen."
      closing_prayer_author: "St. Augustine"
    - day_number: 7
      identity_reading: "By God's grace, I am a man who is humble, avoiding both pride and self loathing."
      wisdom_quote: "The saints that are highest in the sight of God are the least in their own eyes; and the more glorious they are the more humble they are in themselves."
      wisdom_author: "Thomas à Kempis"
      sword_option_1: "The battle against pride and self-reliance; I will acknowledge how much I need others."
      sword_option_2: "The battle against comfort and passivity; I will answer the call to serve instead."
      spade_prompt: "Where did I notice pride or humility at work in me today?"
      closing_prayer: "God, always the same, let me know myself, let me know You. Let me know You, O Lord, who know me; let me know You, as I am known. Amen."
      closing_prayer_author: "St. Augustine"
- year_number: 1
  week_number: 2
  virtue: "Generosity"
  vice: "Greed"
  extreme: "Wastefulness"
  quotes:
    - quote: "The love of Jesus is noble and generous; it spurs us on to do great things and excites us to desire always that which is most perfect."
      author: "Thomas à Kempis"
    - quote: "But grace is bountiful and openhearted, avoids selfishness, is contented with little, and judges it a more blessed thing to give rather than to receive."
      author: "Thomas à Kempis"
  reflection: "Generosity fights greed by holding loosely onto material goods instead of gripping them. Being generous extends to our time, attention, comfort — anything you clutch too tightly or desire too fiercely. A generous man holds nothing too tightly and is like God in being ready to give himself and his goods away. Being able to give something away is proof that you are not ruled by it but are truly free."
  choleric_application: "Might give strategically but struggles to give without controlling how the gift is used."
  choleric_vices: "Transactional giving, using generosity as leverage."
  sanguine_application: "Generous in the moment but inconsistent — easily distracted from sustained giving."
  sanguine_vices: "Impulsive spending, promising more than they deliver."
  melancholic_application: "Fears scarcity deeply, making generosity feel risky and draining."
  melancholic_vices: "Hoarding resources 'just in case,' withholding emotionally."
  phlegmatic_application: "Will give when asked but might be taken advantage of or fail to recognize where he ought to give."
  phlegmatic_vices: "Stinginess with effort, giving the minimum to avoid tension."
  daily_devotionals:
    - day_number: 1
      identity_reading: "By God's grace, I am a man who is generous, avoiding both greed and wastefulness."
      wisdom_quote: "He is truly great, who is great in charity."
      wisdom_author: "Thomas à Kempis"
      sword_option_1: "The pull toward hoarding, control, or withholding; I will give freely instead."
      sword_option_2: "The pull toward impulsiveness, stinginess, or passivity; I will give consistently instead."
      spade_prompt: "Where did I notice greed or generosity at work in me today?"
      closing_prayer: "Take, Lord, and receive all my liberty, my memory, my understanding, and my entire will... Give me only your love and your grace, that is enough for me."
      closing_prayer_author: "St. Ignatius of Loyola"
    - day_number: 2
      identity_reading: "By God's grace, I am a man who is generous, avoiding both greed and wastefulness."
      wisdom_quote: "Without charity the outward work profiteth nothing: but whatever is done out of charity, be it ever so little and contemptible, all becomes fruitful."
      wisdom_author: "Thomas à Kempis"
      sword_option_1: "The temptation to protect what is mine too tightly; I will acknowledge it all belongs to God."
      sword_option_2: "The temptation to avoid inconvenience or effort; I will give with readiness instead."
      spade_prompt: "Where did I notice greed or generosity at work in me today?"
      closing_prayer: "Take, Lord, and receive all my liberty, my memory, my understanding, and my entire will... Give me only your love and your grace, that is enough for me."
      closing_prayer_author: "St. Ignatius of Loyola"
    - day_number: 3

- year_number: 1
  week_number: 1
  virtue: "Humility"
  vice: "Pride"
  extreme: "Self-Loathing"
  quotes:
    - quote: "It is the humble man whom God protects and liberates; it is the humble whom He loves and consoles. To the humble He turns and upon them bestows great grace, that after their humiliation He may raise them up to glory."
      author: "Thomas à Kempis"
    - quote: "Many people try to escape temptations, only to fall more deeply. We cannot conquer simply by fleeing, but by patience and true humility, we become stronger than all our enemies."
      author: "Thomas à Kempis"
  reflection: "Pride has a deep root. Every vice grows from it. This week, through humility you will take note of how often you want to be right, to be seen, to be above others. Pride was the first sin of man, and we fight it until our last breath, learning to trust God. Humility is not weakness. It is the quiet strength of a man who knows his place before God and does not need applause, recognition, or control, because he lives in the truth."
  choleric_application: "Struggles most with humility. Their natural drive to lead and dominate makes submission feel like defeat."
  choleric_vices: "Arrogance, contempt for weakness, need to be right."
  sanguine_application: "Craves attention and approval, making hidden service deeply uncomfortable."
  sanguine_vices: "Vanity, name-dropping, exaggerating accomplishments"
  melancholic_application: "Can mistake self-criticism for humility. True humility requires accepting imperfection without despair."
  melancholic_vices: "Intellectual pride, perfectionism disguised as high standards"
  phlegmatic_application: "Appears humble but may simply be avoiding conflict. Genuine humility requires active surrender, not passive withdrawal."
  phlegmatic_vices: "False modesty, using humility as an excuse for inaction"
  daily_devotionals:
    - day_number: 1
      identity_reading: "By God's grace, I am a man who is humble, avoiding both pride and self loathing."
      wisdom_quote: "He who knows himself well, is mean in his own eyes, and is not delighted with being praised by men."
      wisdom_author: "Thomas à Kempis"
      sword_option_1: "The pull toward control, self-reliance, or proving myself; I will let God lead instead."
      sword_option_2: "The pull toward comfort, approval, or staying invisible; I will serve without recognition instead."
      spade_prompt: "Where did I notice pride or humility at work in me today?"
      closing_prayer: "God, always the same, let me know myself, let me know You. Let me know You, O Lord, who know me; let me know You, as I am known. Amen."
      closing_prayer_author: "St. Augustine"
